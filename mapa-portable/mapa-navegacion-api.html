<!doctype html>
<html lang="es-EC">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Mapa + Navegación (API)</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>
    html, body { margin:0; height:100%; background:#0b1020; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    #map { position:fixed; inset:0; }
    #banner { position:fixed; top:0; left:0; right:0; z-index:5; background:#1a1f35; color:#fff;
      padding:10px 14px; font-weight:800; font-size:15px; display:flex; align-items:center; gap:10px; }
    #banner small { font-weight:600; opacity:.8; font-size:12px; }
    .btn { position:fixed; z-index:6; border:none; border-radius:24px; padding:10px 16px; font-weight:700;
      font-size:13px; box-shadow:0 2px 8px rgba(0,0,0,.35); cursor:pointer; }
    #btnCentrar { left:12px; bottom:16px; background:#fff; color:#2962ff; display:none; }
    #burbuja { position:fixed; z-index:6; top:58px; left:50%; transform:translateX(-50%); background:#1a1f35;
      color:#fff; padding:9px 14px; border-radius:12px; font-weight:800; box-shadow:0 5px 18px rgba(0,0,0,.5);
      display:none; align-items:center; gap:9px; }
    #burbuja.alerta { background:#e53935; }
    #burbuja small { display:block; font-size:11px; font-weight:600; opacity:.85; }
  </style>
</head>
<body>
  <div id="banner">🧭 Navegación <small id="estado">— cargando paradas…</small></div>
  <div id="burbuja"></div>
  <div id="map"></div>
  <button id="btnCentrar" class="btn" onclick="centrarMapa()">◎ Centrar</button>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
  /* ============================================================
     CONFIGURACIÓN
     ============================================================ */
  var CONFIG = {
    bodega: { lat: -0.271474, lng: -78.535354 },

    // >>> Tu API que devuelve las paradas <<<
    // Debe responder un JSON array así:
    //   [ { "cliente": "Viveres Juanita", "lat": -0.246, "lng": -78.509 }, ... ]
    // Cambia la URL por la de tu backend. Si tu API pide POST/token, ajusta
    // cargarParadas() abajo (está marcado dónde).
    apiUrl: 'https://TU-API.com/paradas',

    tiles: ['https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
            'https://b.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
            'https://c.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
            'https://d.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png'],
    osrm: 'https://router.project-osrm.org/route/v1/driving/'
  };

  // Paradas de respaldo (se usan solo si la API falla, para no quedar en blanco).
  var PARADAS_DEMO = [
    { cliente: 'Cliente 1', lat: -0.2461, lng: -78.5090 },
    { cliente: 'Cliente 2', lat: -0.2500, lng: -78.5250 },
    { cliente: 'Cliente 3', lat: -0.2600, lng: -78.5300 }
  ];

  /* ============================================================
     Traer las paradas desde la API (esto es lo que cambia vs la versión fija)
     ============================================================ */
  async function cargarParadas() {
    try {
      // --- GET simple ---
      var r = await fetch(CONFIG.apiUrl);
      // --- Si tu API es POST con token (ej. Apps Script), usa esto en su lugar:
      // var r = await fetch(CONFIG.apiUrl, { method:'POST',
      //   headers:{'Content-Type':'text/plain;charset=utf-8'},
      //   body: JSON.stringify({ accion:'paradas', token: 'XXX' }) });
      var data = await r.json();
      // Normaliza por si tu API envuelve la lista (ej. { paradas:[...] }).
      var lista = Array.isArray(data) ? data : (data.paradas || data.items || []);
      lista = lista
        .map(function(p){ return { cliente: p.cliente || p.nombre || '', lat: +(p.lat), lng: +(p.lng) }; })
        .filter(function(p){ return !isNaN(p.lat) && !isNaN(p.lng); });
      if (!lista.length) throw new Error('API sin paradas');
      return lista;
    } catch (e) {
      console.warn('API falló, uso paradas demo:', e);
      return PARADAS_DEMO;
    }
  }

  /* ============================================================
     MOTOR (idéntico a la versión de paradas fijas)
     ============================================================ */
  var mapa, miMarker=null, marcadores={}, seguir=true, bearing=0;
  var ultimaPos=null, ancla=null, destino=null, paradas=[];
  var segRender=null, segTarget=null, segRAF=null, segZoom=18;
  var maniobra=null, ultimoFetch=0, resumeTimer=null;

  function distMetros(la1,lo1,la2,lo2){ var R=6371000,dLa=(la2-la1)*Math.PI/180,dLo=(lo2-lo1)*Math.PI/180;
    var a=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)*Math.sin(dLo/2);
    return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }
  function rumboEntre(la1,lo1,la2,lo2){ var y=Math.sin((lo2-lo1)*Math.PI/180)*Math.cos(la2*Math.PI/180);
    var x=Math.cos(la1*Math.PI/180)*Math.sin(la2*Math.PI/180)-Math.sin(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.cos((lo2-lo1)*Math.PI/180);
    return (Math.atan2(y,x)*180/Math.PI+360)%360; }
  function linea(coords){ return {type:'Feature',geometry:{type:'LineString',coordinates:coords}}; }

  mapa = new maplibregl.Map({
    container:'map', center:[CONFIG.bodega.lng,CONFIG.bodega.lat], zoom:12, attributionControl:false,
    style:{ version:8, sources:{ carto:{ type:'raster', tiles:CONFIG.tiles, tileSize:256, maxzoom:20 } },
            layers:[{ id:'carto', type:'raster', source:'carto' }] }
  });
  mapa.on('zoomstart', function(e){ if (e.originalEvent) pausarSeguimiento(); });
  mapa.on('dragstart', function(e){ if (e.originalEvent) pausarSeguimiento(); });

  mapa.on('load', async function(){
    paradas = await cargarParadas();     // <<< aquí se piden a la API
    renderParadas(paradas);
    destino = paradas[0];                // demo: navega a la primera
    iniciarGps();
  });

  function renderParadas(lista){
    var b=document.createElement('div'); b.textContent='🏭';
    b.style.cssText='background:#c62828;color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;';
    new maplibregl.Marker({element:b}).setLngLat([CONFIG.bodega.lng,CONFIG.bodega.lat]).addTo(mapa);
    var bounds=new maplibregl.LngLatBounds().extend([CONFIG.bodega.lng,CONFIG.bodega.lat]);
    var coordsPlan=[[CONFIG.bodega.lng,CONFIG.bodega.lat]];
    lista.forEach(function(p,i){
      var el=document.createElement('div'); el.textContent=(i+1);
      el.style.cssText='background:#2962ff;color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;';
      marcadores[i]=new maplibregl.Marker({element:el}).setLngLat([p.lng,p.lat]).addTo(mapa);
      coordsPlan.push([p.lng,p.lat]); bounds.extend([p.lng,p.lat]);
    });
    mapa.addSource('ruta-plan',{type:'geojson',data:linea(coordsPlan)});
    mapa.addLayer({id:'ruta-plan',type:'line',source:'ruta-plan',paint:{'line-color':'#2962ff','line-width':3,'line-opacity':.5,'line-dasharray':[2,2]}});
    mapa.addSource('ruta-nav',{type:'geojson',data:linea([])});
    mapa.addLayer({id:'nav-casing',type:'line',source:'ruta-nav',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#0b3ea8','line-width':11,'line-opacity':.9}});
    mapa.addLayer({id:'nav-line',type:'line',source:'ruta-nav',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#2b7cff','line-width':7}});
    if (coordsPlan.length>1) mapa.fitBounds(bounds,{padding:50,duration:0});
  }

  function iniciarGps(){
    if (!navigator.geolocation){ document.getElementById('estado').textContent='— sin GPS'; return; }
    navigator.geolocation.watchPosition(onPos, function(){}, { enableHighAccuracy:true, maximumAge:1000, timeout:8000 });
    setInterval(function(){ navigator.geolocation.getCurrentPosition(onPos, function(){}, { enableHighAccuracy:true, maximumAge:1000 }); }, 1000);
  }

  function onPos(pos){
    var la=pos.coords.latitude, lo=pos.coords.longitude, acc=pos.coords.accuracy||999, vel=pos.coords.speed;
    if (ultimaPos){ var d=distMetros(ultimaPos.lat,ultimaPos.lng,la,lo); if (d>200 && acc>80) return; }
    document.getElementById('estado').textContent = destino ? ('→ '+destino.cliente) : '';
    var casiParado=(typeof vel==='number' && vel<0.8);
    if (!ancla) ancla={lat:la,lng:lo};
    if (!casiParado){
      if (typeof pos.coords.heading==='number' && !isNaN(pos.coords.heading) && vel>=2){ bearing=pos.coords.heading; ancla={lat:la,lng:lo}; }
      else if (distMetros(ancla.lat,ancla.lng,la,lo)>12){ bearing=rumboEntre(ancla.lat,ancla.lng,la,lo); ancla={lat:la,lng:lo}; }
    }
    ultimaPos={lat:la,lng:lo};
    if (!miMarker){ var el=document.createElement('div');
      el.style.cssText='width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:22px solid #1a73e8;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));';
      miMarker=new maplibregl.Marker({element:el,rotationAlignment:'map'}).setLngLat([lo,la]).addTo(mapa); }
    segTarget={lat:la,lng:lo,bearing:bearing};
    if (!segRender) segRender={lat:la,lng:lo,bearing:bearing};
    arrancarRAF();
    actualizarBurbuja(la,lo);
    if (destino && Date.now()-ultimoFetch>9000){ ultimoFetch=Date.now(); fetchRuta(la,lo,destino.lat,destino.lng); }
  }

  function offsetSeg(){ var h=mapa.getContainer().clientHeight; return [0, Math.round(h*0.31)]; }
  function zoomObjetivo(){ var base=17.7; if (!segTarget||!maniobra) return base;
    var d=distMetros(segTarget.lat,segTarget.lng,maniobra.lat,maniobra.lng);
    if (d<45) return 19; if (d<100) return 18.4; return base; }
  function arrancarRAF(){ if (segRAF!==null) return;
    var loop=function(){ segRAF=null; if (!segTarget||!segRender) return;
      var k=0.05; segRender.lat+=(segTarget.lat-segRender.lat)*k; segRender.lng+=(segTarget.lng-segRender.lng)*k;
      var db=((segTarget.bearing-segRender.bearing+540)%360)-180; segRender.bearing+=db*k;
      if (miMarker){ miMarker.setLngLat([segRender.lng,segRender.lat]); miMarker.setRotation(segRender.bearing); }
      var zt=zoomObjetivo(); segZoom+=(zt-segZoom)*0.06;
      if (seguir) mapa.easeTo({center:[segRender.lng,segRender.lat],bearing:segRender.bearing,zoom:segZoom,offset:offsetSeg(),duration:0});
      var lejos=Math.abs(segTarget.lat-segRender.lat)>2e-7||Math.abs(segTarget.lng-segRender.lng)>2e-7||Math.abs(db)>0.3||Math.abs(zt-segZoom)>0.02;
      if (lejos) segRAF=requestAnimationFrame(loop);
    };
    segRAF=requestAnimationFrame(loop);
  }
  function centrarMapa(){ seguir=true; document.getElementById('btnCentrar').style.display='none';
    if (resumeTimer){ clearTimeout(resumeTimer); resumeTimer=null; }
    if (miMarker){ var ll=miMarker.getLngLat(); segZoom=zoomObjetivo();
      mapa.easeTo({center:[ll.lng,ll.lat],bearing:bearing,zoom:segZoom,offset:offsetSeg(),duration:600}); } }
  function pausarSeguimiento(){ seguir=false; document.getElementById('btnCentrar').style.display='block';
    if (resumeTimer) clearTimeout(resumeTimer); resumeTimer=setTimeout(function(){ if(!seguir) centrarMapa(); }, 9000); }

  function fetchRuta(la,lo,dLa,dLo){
    fetch(CONFIG.osrm+lo+','+la+';'+dLo+','+dLa+'?overview=full&geometries=geojson&steps=true')
      .then(function(r){return r.json();})
      .then(function(d){
        if (!d.routes||!d.routes[0]) return;
        mapa.getSource('ruta-nav').setData({type:'Feature',geometry:d.routes[0].geometry});
        maniobra=null;
        var pasos=(d.routes[0].legs&&d.routes[0].legs[0]&&d.routes[0].legs[0].steps)||[];
        for (var i=0;i<pasos.length;i++){ var m=pasos[i].maneuver;
          if (m && m.location && m.type!=='depart'){ maniobra={lat:m.location[1],lng:m.location[0],txt:(m.modifier||m.type||'giro'),calle:pasos[i].name||''}; break; } }
      }).catch(function(){});
  }
  function actualizarBurbuja(la,lo){ var b=document.getElementById('burbuja');
    if (!maniobra){ b.style.display='none'; return; }
    var d=distMetros(la,lo,maniobra.lat,maniobra.lng);
    if (d<160){ b.style.display='flex'; b.className=(maniobra.txt.indexOf('uturn')>=0?'alerta':'');
      b.innerHTML='<div>↱</div><div>'+Math.round(d)+' m<small>'+maniobra.txt+(maniobra.calle?' · '+maniobra.calle:'')+'</small></div>'; }
    else b.style.display='none'; }
  </script>
</body>
</html>
