<!DOCTYPE html>
<html lang="es-EC">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Acceso de choferes (PRUEBAS)</title>
  <style>
    :root { --navy:#1a1f35; --navy2:#232a45; --verde:#00c853; --rojo:#ff5252; --txt:#eaf0ff; --mut:#9fb0d0; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; min-height:100vh; background:var(--navy); color:var(--txt);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { width:100%; max-width:360px; background:var(--navy2); border-radius:20px;
      padding:28px 22px; box-shadow:0 12px 40px rgba(0,0,0,.4); }
    .badge { display:inline-block; font-size:11px; font-weight:800; letter-spacing:.12em;
      background:#3a2a00; color:#ffcf5c; padding:4px 10px; border-radius:999px; margin-bottom:14px; }
    h1 { font-size:19px; margin:0 0 4px; }
    .sub { color:var(--mut); font-size:13px; margin:0 0 20px; line-height:1.5; }
    label { display:block; font-size:12px; color:var(--mut); margin:14px 0 6px; font-weight:700; }
    input { width:100%; padding:14px 16px; font-size:18px; border:1.5px solid #34406b;
      background:#141a30; color:#fff; border-radius:12px; outline:none; }
    input:focus { border-color:var(--verde); }
    input.codigo { text-align:center; letter-spacing:.35em; font-size:24px; }
    button { width:100%; margin-top:18px; padding:15px; font-size:16px; font-weight:800;
      border:0; border-radius:12px; cursor:pointer; }
    .primary { background:var(--verde); color:#06280f; }
    .link { background:none; color:var(--mut); font-weight:700; text-decoration:underline; padding:10px; margin-top:8px; font-size:13px; }
    .msg { margin-top:14px; padding:12px 14px; border-radius:10px; font-size:13.5px; display:none; line-height:1.5; }
    .msg.err { background:#3a1414; color:#ffb4b4; display:block; }
    .msg.ok  { background:#0f2e1a; color:#9be7b4; display:block; }
    .hidden { display:none; }
    .perfil { background:#141a30; border-radius:12px; padding:16px; font-size:14px; line-height:1.7; margin-top:8px; }
    .perfil b { color:var(--mut); font-weight:700; }
    .spin { width:34px; height:34px; border-radius:50%; margin:10px auto;
      border:3px solid rgba(255,255,255,.2); border-top-color:var(--verde); animation:g .9s linear infinite; }
    @keyframes g { to { transform:rotate(360deg); } }
    .center { text-align:center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🧪 PROYECTO DE PRUEBAS</div>

    <!-- ===== Verificando sesión al abrir ===== -->
    <div id="cargando" class="center">
      <div class="spin"></div>
      <p class="sub">Verificando tu acceso…</p>
    </div>

    <!-- ===== PASO 1: correo ===== -->
    <div id="paso-correo" class="hidden">
      <h1>Acceso de choferes</h1>
      <p class="sub">Ingresa el correo que te asignó tu administrador. Te enviaremos un código una sola vez.</p>
      <label>Tu correo</label>
      <input id="correoInput" type="email" inputmode="email" placeholder="tucorreo@gmail.com" autocomplete="email">
      <button class="primary" onclick="enviarCodigo()">RECIBIR MI CÓDIGO</button>
    </div>

    <!-- ===== PASO 2: código (OTP) ===== -->
    <div id="paso-otp" class="hidden">
      <h1>Ingresa tu código</h1>
      <p class="sub" id="otpSub">Revisa tu correo.</p>
      <label>Código de 6 dígitos</label>
      <input id="otpInput" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code">
      <button class="primary" onclick="verificarCodigo()">VERIFICAR Y ENTRAR</button>
      <button class="link" onclick="verModo('correo')">← Usar otro correo / reenviar</button>
    </div>

    <!-- ===== Dentro (prueba de sesión protegida) ===== -->
    <div id="home" class="hidden">
      <h1 id="hola">Hola</h1>
      <p class="sub">Ya estás dentro. En este celular no tendrás que volver a ingresar ningún código.</p>
      <div class="perfil" id="perfil">Cargando perfil…</div>
      <button class="primary" onclick="probarPing()">Probar acción protegida (ping)</button>
      <button class="link" onclick="cerrarSesion()">Cerrar sesión (solo pruebas)</button>
      <div id="msgHome" class="msg"></div>
    </div>

    <div id="msg" class="msg"></div>
  </div>

<script>
  // ---------- estado local ----------
  var LS_DEVICE = 'choferes_device_id';
  var LS_TOKEN  = 'choferes_token';   // acceso único durable (interno; el chofer NUNCA lo teclea)

  function obtenerDeviceId() {
    var id = localStorage.getItem(LS_DEVICE);
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + '-' + Math.random()));
      localStorage.setItem(LS_DEVICE, id);
    }
    return id;
  }
  function getToken() { return localStorage.getItem(LS_TOKEN) || ''; }
  function setToken(t) { localStorage.setItem(LS_TOKEN, t); }
  function borrarToken() { localStorage.removeItem(LS_TOKEN); }

  // ---------- wrapper único (manda deviceId siempre; se autoexpulsa) ----------
  function apiCall(accion, extra) {
    return new Promise(function (resolve, reject) {
      var sobre = Object.assign({
        accion: accion,
        deviceId: obtenerDeviceId(),
        sesionToken: getToken(),
      }, extra || {});
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.sesionInvalida) { manejarSesionInvalida(res.error); reject(res); return; }
          resolve(res || {});
        })
        .withFailureHandler(function (err) { reject({ error: (err && err.message) || 'Error de red' }); })
        .api(sobre);
    });
  }

  function manejarSesionInvalida(txt) {
    borrarToken();
    verModo('correo');
    msg('err', txt || 'Tu sesión terminó. Contacta a tu administrador.');
  }

  // ---------- UI ----------
  function $(id) { return document.getElementById(id); }
  function ocultarTodo() {
    ['cargando', 'paso-correo', 'paso-otp', 'home'].forEach(function (x) { $(x).classList.add('hidden'); });
  }
  function verModo(m) {
    ocultarTodo();
    if (m === 'correo') { $('paso-correo').classList.remove('hidden'); foco('correoInput'); }
    else if (m === 'otp') { $('paso-otp').classList.remove('hidden'); foco('otpInput'); }
    else if (m === 'home') { $('home').classList.remove('hidden'); }
    else if (m === 'cargando') { $('cargando').classList.remove('hidden'); }
    limpiarMsg();
  }
  function foco(id) { setTimeout(function () { var el = $(id); if (el) el.focus(); }, 60); }
  function msg(tipo, txt) { var m = $('msg'); m.className = 'msg ' + tipo; m.textContent = txt; }
  function limpiarMsg() { var m = $('msg'); m.className = 'msg'; m.textContent = ''; }

  // ---------- flujo correo -> OTP -> dentro ----------
  var _correo = '';

  function enviarCodigo() {
    var correo = ($('correoInput').value || '').trim();
    if (!correo) { msg('err', 'Escribe tu correo.'); return; }
    _correo = correo;
    msg('ok', 'Enviando código…');
    apiCall('solicitarOtp', { params: { correo: correo }, sesionToken: '' }).then(function (res) {
      if (res.estado === 200) {
        verModo('otp');
        $('otpSub').textContent = 'Enviamos un código a ' + correo + '. Vence en 10 minutos.';
      } else if (res.yaVerificado) {
        // Ya tiene acceso pero este celular no lo tiene guardado (reinstaló, etc.)
        msg('err', res.error);
      } else {
        msg('err', res.error || 'No se pudo enviar el código.');
      }
    }).catch(function (e) { msg('err', (e && e.error) || 'Error al enviar.'); });
  }

  function verificarCodigo() {
    var codigo = ($('otpInput').value || '').trim();
    if (!codigo) { msg('err', 'Escribe el código.'); return; }
    msg('ok', 'Verificando…');
    apiCall('verificarOtp', { params: { correo: _correo, codigo: codigo }, sesionToken: '' }).then(function (res) {
      if (res.estado === 200 && res.pin) {
        // Verificar el correo NO ata el dispositivo: hay que llamar de una a
        // login con el pin devuelto para completar el vínculo (acceso único).
        return apiCall('login', { pin: res.pin, sesionToken: '' }).then(function (r2) {
          if (r2.estado === 200 && r2.pin) {
            setToken(r2.pin);   // se guarda internamente; el chofer no lo verá nunca más
            entrar(r2.nombre);
          } else if (r2.dispositivoDistinto) {
            msg('err', r2.error);
          } else {
            msg('err', r2.error || 'No se pudo completar el acceso.');
          }
        });
      }
      msg('err', res.error || 'Código incorrecto o vencido.');
    }).catch(function (e) { msg('err', (e && e.error) || 'No se pudo verificar.'); });
  }

  function entrar(nombre) {
    verModo('home');
    $('hola').textContent = 'Hola, ' + (nombre || '');
    cargarPerfil();
  }

  // ---------- dentro (pruebas) ----------
  function cargarPerfil() {
    apiCall('miPerfil').then(function (p) {
      if (p.estado !== 200) { $('perfil').textContent = p.error || 'No se pudo cargar.'; return; }
      $('perfil').innerHTML =
        '<div><b>Nombre:</b> ' + (p.nombre || '') + '</div>' +
        '<div><b>Correo:</b> ' + (p.correo || '—') + '</div>' +
        '<div><b>Ruta:</b> ' + (p.rutaColor || '—') + '</div>' +
        '<div><b>Placa:</b> ' + (p.placa || '—') + '</div>';
    }).catch(function () {});
  }
  function probarPing() {
    apiCall('ping').then(function (r) {
      var m = $('msgHome'); m.className = 'msg ok'; m.textContent = '✓ Acción protegida OK — ' + (r.cuando || '');
    }).catch(function (e) {
      var m = $('msgHome'); m.className = 'msg err'; m.textContent = (e && e.error) || 'Sesión inválida.';
    });
  }
  function cerrarSesion() { borrarToken(); verModo('correo'); }

  // ---------- arranque: si ya tiene acceso en este celular, entra directo ----------
  (function init() {
    obtenerDeviceId();
    verModo('cargando');
    if (getToken()) {
      apiCall('miPerfil').then(function (p) {
        if (p.estado === 200) entrar(p.nombre); else verModo('correo');
      }).catch(function () { /* sesionInvalida ya llevó a 'correo' */ });
    } else {
      verModo('correo');
    }
  })();
</script>
</body>
</html>
