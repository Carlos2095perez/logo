<!doctype html>
<html lang="es-EC">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Chóferes INDUYES</title>
  <meta name="theme-color" content="#1a1f35" />
  <meta name="description" content="Aplicación de cierre de ruta para los choferes de Industria Alimenticia YES." />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Chóferes INDUYES" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <style>
    :root { --navy:#1a1f35; --verde:#00c853; }
    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; width:100%; background:var(--navy); color:#fff;
      overflow:hidden; overscroll-behavior:none;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    .wrap { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:22px; text-align:center;
      padding:env(safe-area-inset-top) 28px env(safe-area-inset-bottom); }
    img { width:128px; height:128px; border-radius:28px; box-shadow:0 8px 30px rgba(0,0,0,.4); }
    .marca { font-size:12px; letter-spacing:.14em; text-transform:uppercase; opacity:.65; font-weight:800; }
    .spinner { width:34px; height:34px; border-radius:50%; margin-top:4px;
      border:3px solid rgba(255,255,255,.2); border-top-color:var(--verde); animation:giro .9s linear infinite; }
    @keyframes giro { to { transform:rotate(360deg); } }
    #btn { display:none; margin-top:10px; background:var(--verde); color:#06280f; border:0;
      border-radius:999px; padding:14px 26px; font-weight:800; font-size:16px; cursor:pointer;
      text-decoration:none; }
    .hint { font-size:12.5px; opacity:.6; max-width:280px; line-height:1.5; }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="icons/icon-192.png" alt="Chóferes INDUYES" />
    <div class="marca">Industria Alimenticia YES</div>
    <div class="spinner" id="spin"></div>
    <a id="btn" href="#">Abrir aplicación</a>
    <div class="hint" id="hint"></div>
  </div>

  <script>
    (function () {
      // URL real de la app (Apps Script). La PWA la abre a pantalla completa,
      // NO la incrusta en un iframe: Google bloquea el iframe en el celular
      // (error "no se pudo abrir el archivo"), pero abierta directamente
      // funciona igual que en Chrome (GPS y cámara incluidos).
      var APP_URL = "https://script.google.com/macros/s/AKfycbzNNsRS5dbZYWDEbzzsleO0Z9CPiYmedMTWjivhebEBmHWMs5aEZYex4A9vhsa8-aOvng/exec";

      var btn = document.getElementById('btn');
      var hint = document.getElementById('hint');
      btn.setAttribute('href', APP_URL);

      // Registrar el service worker (hace instalable la PWA).
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js').catch(function () {});
      }

      // Abrir la app. Si el navegador bloquea la redirección automática,
      // mostramos el botón para abrirla manualmente.
      var redirigido = false;
      function abrir() {
        if (redirigido) return;
        redirigido = true;
        window.location.replace(APP_URL);
      }
      setTimeout(abrir, 500);

      // Respaldo: si en 3.5s seguimos aquí, muestra el botón.
      setTimeout(function () {
        document.getElementById('spin').style.display = 'none';
        btn.style.display = 'inline-block';
        hint.textContent = 'Si no abrió sola, toca el botón.';
      }, 3500);
    })();
  </script>
</body>
</html>
